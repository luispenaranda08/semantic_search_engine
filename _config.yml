title: Buscador Semántico GovTech
author: Luis David Peñaranda
copyright: "2026"
logo: images/portada.png
language: es
only_build_toc_files: true
exclude_patterns: [.venv-book, .venv-book/**, _build, _scripts, README.md, "**.ipynb_checkpoints"]

execute:
  execute_notebooks: "off"   # los notebooks se publican con sus salidas ya ejecutadas

repository:
  url: https://github.com/luispenaranda08/semantic_search_engine
  branch: main

html:
  use_repository_button: true
  use_issues_button: false
  home_page_in_navbar: true
  baseurl: https://luispenaranda08.github.io/semantic_search_engine/

parse:
  myst_enable_extensions:
    - dollarmath
    - amsmath
    - colon_fence
    - deflist
    - html_image

sphinx:
  extra_extensions:
    - sphinxcontrib.mermaid
  config:
    language: es
    mermaid_version: "11.4.0"
    html_show_copyright: true
    suppress_warnings: ["myst.header", "mystnb.unknown_mime_type"]
